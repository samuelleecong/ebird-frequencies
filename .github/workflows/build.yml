name: Build site from eBird data

on:
  workflow_dispatch:
    inputs:
      release:
        description: "EBD release, e.g. relAug-2026 (blank = newest available)"
        required: false
      sample_gb:
        description: "Smoke test: only read the first N GB of the observations file (0 = everything)"
        default: "0"
      stop_after:
        description: "How long each part runs before handing over (testing: e.g. 4m)"
        default: "5h15m"
  schedule:
    - cron: "0 3 17 * *" # eBird publishes each release on the 15th

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.name }}
    steps:
      - name: Find EBD release
        id: release
        env:
          BASE: https://download.ebird.org/ebd/prepackaged
        run: |
          rel="${{ inputs.release }}"
          if [ -z "$rel" ]; then
            for back in 1 2 3 4; do
              candidate="rel$(date -d "$(date +%Y-%m-15) -$back month" +%b-%Y)"
              if curl -sfI "$BASE/ebd_$candidate.tar" > /dev/null; then rel=$candidate; break; fi
            done
          fi
          [ -n "$rel" ] || { echo "No EBD release found"; exit 1; }
          echo "Using $rel"
          echo "name=$rel" >> "$GITHUB_OUTPUT"

  # eBird's download speed varies from run to run (3–17 MB/s for ~250 GB), so the build runs in
  # up to four ~5-hour parts, each resuming where the last one paused.
  part1:
    needs: prep
    uses: ./.github/workflows/build-part.yml
    with: { part: 1, release: "${{ needs.prep.outputs.release }}", sample_gb: "${{ inputs.sample_gb || '0' }}", stop_after: "${{ inputs.stop_after || '5h15m' }}" }
  part2:
    needs: [prep, part1]
    if: needs.part1.outputs.done != 'true'
    uses: ./.github/workflows/build-part.yml
    with: { part: 2, resume_from: state-1, release: "${{ needs.prep.outputs.release }}", sample_gb: "${{ inputs.sample_gb || '0' }}", stop_after: "${{ inputs.stop_after || '5h15m' }}" }
  part3:
    needs: [prep, part2]
    if: needs.part2.outputs.done != 'true'
    uses: ./.github/workflows/build-part.yml
    with: { part: 3, resume_from: state-2, release: "${{ needs.prep.outputs.release }}", sample_gb: "${{ inputs.sample_gb || '0' }}", stop_after: "${{ inputs.stop_after || '5h15m' }}" }
  part4:
    needs: [prep, part3]
    if: needs.part3.outputs.done != 'true'
    uses: ./.github/workflows/build-part.yml
    with: { part: 4, resume_from: state-3, release: "${{ needs.prep.outputs.release }}", sample_gb: "${{ inputs.sample_gb || '0' }}", stop_after: "${{ inputs.stop_after || '5h15m' }}" }

  publish:
    needs: [prep, part1, part2, part3, part4]
    if: always() && contains(join(needs.*.outputs.done, ','), 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: pipeline/go.mod
          cache: false

      - name: Build aggregator
        run: cd pipeline && go build -o ../ebdagg .

      - name: Which part finished
        id: which
        run: |
          for p in 1 2 3 4; do
            done_var="DONE_$p"
            if [ "${!done_var}" = true ]; then echo "artifact=state-$p" >> "$GITHUB_OUTPUT"; echo "part $p finished"; break; fi
          done
        env:
          DONE_1: ${{ needs.part1.outputs.done }}
          DONE_2: ${{ needs.part2.outputs.done }}
          DONE_3: ${{ needs.part3.outputs.done }}
          DONE_4: ${{ needs.part4.outputs.done }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.which.outputs.artifact }}
          path: state

      - name: Fetch eBird taxonomy
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          curl -sSf -H "X-eBirdApiToken: $EBIRD_API_KEY" "https://api.ebird.org/v2/ref/taxonomy/ebird?fmt=json&cat=species" -o taxonomy.json

      - name: Write site data
        run: ./ebdagg publish -state state -taxonomy taxonomy.json -out site/data -release "${{ needs.prep.outputs.release }}"

      - name: Assemble site
        run: |
          cp -r public/. site/
          du -sh site site/data/*

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 90 # deploy-page.yml reuses this data when only the page changes

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

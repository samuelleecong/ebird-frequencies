<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifer Map</title>
<meta name="description" content="Find where any bird is seen most often, and the hotspots with the most birds you haven't seen yet. Built on the eBird Basic Dataset.">
<meta name="theme-color" content="#f7f2e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='36' r='22' fill='%233e7c59'/%3E%3Ccircle cx='38' cy='28' r='4' fill='%23fff'/%3E%3Ccircle cx='39' cy='28' r='2' fill='%23222'/%3E%3Cpath d='M50 30l10 3-10 3z' fill='%23f2a14b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Map of hotspots"></div>

<section class="panel" id="panel" aria-label="Lifer Map">
  <button class="sheet-handle" id="sheet-handle" aria-label="Expand or collapse panel"><span></span></button>

  <header class="brand">
    <a class="logo" href="#" id="home" aria-label="Lifer Map home">
      <svg viewBox="0 0 64 64" class="bird" aria-hidden="true">
        <ellipse class="bird-tail" cx="14" cy="40" rx="10" ry="5" transform="rotate(-25 14 40)"/>
        <circle class="bird-body" cx="31" cy="36" r="20"/>
        <path class="bird-belly" d="M18 44c6 9 22 10 30 0-8 4-22 4-30 0z"/>
        <path class="bird-wing" d="M20 34c6-6 16-6 20 2-6 6-16 5-20-2z"/>
        <g class="bird-eye"><circle cx="40" cy="29" r="4.5" fill="#fff"/><circle cx="41" cy="29" r="2.4" fill="#1f2a24"/></g>
        <path class="bird-beak" d="M49 31l9 3-9 3z"/>
        <path class="bird-legs" d="M27 55v5M35 55v5"/>
      </svg>
      <span>Lifer Map</span>
    </a>
    <button class="lifelist-chip" id="lifelist-chip" type="button"></button>
  </header>

  <div class="controls">
    <label class="region">
      <span class="sr-only">Region</span>
      <select id="region"></select>
    </label>
    <div class="months-label"><span>📅 When are you birding? <b id="months-summary">All year</b></span><span class="muted">tap or drag months</span></div>
    <div class="months" id="months" role="group" aria-label="Months (tap or drag to choose)"></div>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="find"><span aria-hidden="true">🔭</span> Find a bird</button>
    <button role="tab" data-tab="spot"><span aria-hidden="true">📍</span> Hotspot</button>
    <button role="tab" data-tab="hunt"><span aria-hidden="true">✨</span> Lifer hunt</button>
  </nav>

  <main class="view" id="view" aria-live="polite"></main>

  <footer class="credits">
    Frequencies from the <a href="https://ebird.org/data/download" target="_blank" rel="noopener">eBird Basic Dataset</a>,
    Cornell Lab of Ornithology · <span id="release"></span> · Photos: Wikipedia &amp; iNaturalist
  </footer>
</section>

<dialog id="lifelist-dialog" class="dialog">
  <form method="dialog" class="dialog-close"><button aria-label="Close">×</button></form>
  <div id="lifelist-body"></div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
